name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:clean
      - run: npm run build
      - name: Inspect clean frames
        if: runner.os == 'Linux'
        run: npm run inspect:clean
      - name: Upload static review frames
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-review-frames
          path: out/clean-review/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
